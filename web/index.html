<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>fldigi - NO CALLSIGN SET (receive-only alpha)</title><link rel="icon" href="icons/fldigi/fldigi_icon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body>
<main class="fldigi-window" aria-label="fldigi browser receiver">
  <header class="titlebar"><span class="app-icon" aria-hidden="true"><img class="ui-icon exact-icon" src="icons/fldigi/fldigi_icon.png" alt="" aria-hidden="true"></span><span id="window-title">fldigi - NO CALLSIGN SET (receive-only alpha)</span><span class="window-buttons" aria-hidden="true"><span>─</span><span>□</span><span>×</span></span></header>
  <nav class="menubar" aria-label="Main menu">
    <div class="menus">
      <div class="menu"><button class="menu-heading" aria-expanded="false">File</button><div class="menu-popup">
        <div class="menu-branch"><button class="submenu-heading" aria-haspopup="true" aria-expanded="false">Audio</button><div class="menu-submenu">
          <button data-action="live">RX capture (use mic)<kbd>F3</kbd></button><button disabled title="Audio generation is reserved for a future version">TX generate (save audio file)</button><button data-action="open-audio">Playback (load audio file)<kbd>Ctrl+O</kbd></button><hr><button data-action="stop">Stop audio</button>
        </div></div><hr>
        <button data-action="export-text">Save received text…<kbd>Ctrl+S</kbd></button><button data-action="clear">Clear received text</button><hr>
        <button data-action="import-config">Import configuration…</button><button data-action="export-config">Export configuration…</button></div></div>
      <div class="menu" id="mode-menu"><button class="menu-heading" aria-expanded="false">Op Mode</button><div class="menu-popup mode-popup" id="mode-options"><span class="menu-loading">Loading modems…</span></div></div>
      <div class="menu"><button class="menu-heading" aria-expanded="false">Configure</button><div class="menu-popup"><button data-config="Operator-Station" disabled title="Operator details are unused by this receiver">Operator…</button><button data-config="Soundcard/Devices">Sound card…</button><button data-config="Modem/PSK">Modems…</button><button data-config="Waterfall">Waterfall…</button><button data-config="UI">User interface…</button><hr><button data-config="Rig Control" disabled>Rig control…</button><button data-config="IO" disabled>External interfaces…</button></div></div>
      <div class="menu"><button class="menu-heading" aria-expanded="false">View</button><div class="menu-popup"><button data-action="toggle-browser">Channels</button><button data-action="toggle-scope">Docked scope</button><button data-action="show-picture">Received picture…</button><button data-action="fullscreen">Full screen</button><hr><button data-action="clear-waterfall">Clear waterfall</button></div></div>
      <div class="menu"><button class="menu-heading" aria-expanded="false" disabled title="Logbook support is disabled in this version">Logbook</button><div class="menu-popup"><button disabled title="Logbook integrations are disabled in this receive version">Open logbook</button><button disabled>Log QSO</button><button disabled>External logger</button></div></div>
      <div class="menu"><button class="menu-heading" aria-expanded="false">Help</button><div class="menu-popup help-popup">
        <a class="menu-icon-row" href="beginners.html" target="_blank" rel="noopener"><img class="ui-icon exact-icon" src="icons/fldigi/start_here_icon.png" alt="" aria-hidden="true">Beginners' Guide</a>
        <a class="menu-icon-row" href="https://www.w1hkj.org/FldigiHelp/index.html" target="_blank" rel="noopener noreferrer"><img class="ui-icon exact-icon" src="icons/fldigi/help_browser_icon.png" alt="" aria-hidden="true">Online documentation...</a>
        <a class="menu-icon-row" href="https://www.w1hkj.org/Fldigi.html" target="_blank" rel="noopener noreferrer"><img class="ui-icon exact-icon" src="icons/fldigi/net_icon.png" alt="" aria-hidden="true">Fldigi web site...</a>
        <a class="menu-icon-row" href="https://pskreporter.info/pskmap" target="_blank" rel="noopener noreferrer"><img class="ui-icon exact-icon" src="icons/fldigi/pskr_icon.png" alt="" aria-hidden="true">Reception reports...</a><hr>
        <button class="menu-icon-row" disabled title="Command-line options apply to the native application; see Browser receiver help for this version."><img class="ui-icon exact-icon" src="icons/fldigi/utilities_terminal_icon.png" alt="" aria-hidden="true">Command line options</button>
        <button class="menu-icon-row" data-action="audio-info"><img class="ui-icon exact-icon" src="icons/fldigi/audio_card_icon.png" alt="" aria-hidden="true">Audio device info</button>
        <button class="menu-icon-row" data-action="build-info"><img class="ui-icon exact-icon" src="icons/fldigi/executable_icon.png" alt="" aria-hidden="true">Build info</button>
        <button class="menu-icon-row" data-action="event-log"><img class="ui-icon exact-icon" src="icons/fldigi/dialog_information_icon.png" alt="" aria-hidden="true">Event log</button><hr>
        <button class="menu-icon-row" data-action="about"><img class="ui-icon exact-icon" src="icons/fldigi/help_about_icon.png" alt="" aria-hidden="true">About<kbd>A</kbd></button><hr>
        <button class="menu-icon-row" data-action="help"><svg class="ui-icon icon-blue" aria-hidden="true"><use href="icons/fontawesome.svg#book-open"></use></svg>Browser receiver help</button>
        <a class="menu-icon-row" href="https://github.com/crashdemons-external/fldigi-web" target="_blank" rel="noopener noreferrer"><svg class="ui-icon" aria-hidden="true"><use href="icons/fontawesome.svg#github"></use></svg>Download source code…</a>
        <a class="menu-icon-row" href="LICENSE.txt" target="_blank" rel="noopener"><img class="ui-icon exact-icon" src="icons/fldigi/text_icon.png" alt="" aria-hidden="true">License</a>
      </div></div>
    </div>
    <div class="rig-buttons"><button disabled>⌜Spot</button><button disabled title="Automatic mode identification is not available in this build">⌜RxID</button><button disabled>⌜TxID</button><button disabled>⌜TUNE</button><span class="blank-button"></span></div>
  </nav>
  <section class="station-panel" aria-label="Station information">
    <div class="radio-panel"><div class="dial" aria-label="Displayed radio frequency">14070.100</div><div class="radio-mode"><select id="sideband" aria-label="Receive sideband" title="Sideband of the audio source; changes decode polarity"><option value="USB">USB</option><option value="LSB">LSB</option></select><select disabled aria-label="Radio bandwidth"><option>3000</option></select><button class="icon-button" data-action="open-audio" title="Playback (load audio file)" aria-label="Playback (load audio file)"><svg class="ui-icon icon-blue" aria-hidden="true"><use href="icons/fontawesome.svg#file-audio"></use></svg></button><button class="icon-button" data-action="live" title="RX capture (use mic) (F3)" aria-label="RX capture (use mic)"><svg class="ui-icon icon-green" aria-hidden="true"><use href="icons/fontawesome.svg#microphone"></use></svg></button><button class="icon-button" data-config="Soundcard/Devices" title="Configure" aria-label="Configure"><svg class="ui-icon icon-blue" aria-hidden="true"><use href="icons/fontawesome.svg#gear"></use></svg></button></div></div>
    <div class="qso-panel">
      <div class="qso-row"><span class="tiny-icon" aria-hidden="true"><img class="ui-icon exact-icon" src="icons/fldigi/net_icon.png" alt="" aria-hidden="true"></span><label>Frq <input id="qso-frequency" value="14071.600" disabled></label><button disabled>On</button><input disabled aria-label="Rig offset"><label>Off <input id="frequency-top" type="number" min="0" max="4000" value="1500" aria-label="Audio frequency"></label><label>In <input id="input-level" readonly aria-label="Input level"></label><label>Out <input disabled aria-label="Output level"></label></div>
      <div class="qso-row unavailable" title="Contact details are unused by this receiver"><span class="tiny-icon" aria-hidden="true"><img class="ui-icon exact-icon" src="icons/fldigi/edit_clear_icon.png" alt="" aria-hidden="true"></span><label>Call <input id="contact-call" aria-label="Contact callsign" disabled></label><label>Op <input id="contact-name" aria-label="Contact name" disabled></label><label>Az <input disabled></label></div>
      <div class="qso-row unavailable" title="Contact details are unused by this receiver"><span class="tiny-icon" aria-hidden="true"><img class="ui-icon exact-icon" src="icons/fldigi/save_icon.png" alt="" aria-hidden="true"></span><label>Qth <input id="contact-qth" aria-label="Contact location" disabled></label><label>St <input class="short" aria-label="State" disabled></label><label>Pr <input class="short" aria-label="Province" disabled></label><label>Loc <input id="contact-locator" aria-label="Locator" disabled></label></div>
    </div>
    <div class="station-notes"><input disabled aria-label="Rig control status"><textarea disabled aria-label="External station information"></textarea></div>
  </section>
  <section class="text-panels">
    <aside class="channel-panel" id="channel-panel" aria-label="PSK channel browser"><div class="channel-list" id="channel-list"></div><input value="CQ" id="channel-search" aria-label="Channel search"><div class="channel-controls"><output id="channel-squelch-label">-3.0</output><input type="range" id="channel-squelch" min="-3" max="6" step="0.1" value="-3" aria-label="Channel squelch"><button data-action="clear-channels"><img class="ui-icon exact-icon" src="icons/fldigi/edit_clear_icon.png" alt="" aria-hidden="true"> Clear</button></div></aside>
    <div class="rx-tx-panels"><div class="rx-pane"><textarea id="rx-text" spellcheck="false" readonly aria-label="Received text"></textarea></div><div class="tx-pane"><textarea id="tx-text" disabled aria-label="Transmit text (disabled)" title="Transmission is disabled in this receive version"></textarea><div class="playback-bar" id="playback-bar" hidden><button id="play-file" aria-label="Play audio file">▶</button><button id="stop-file" aria-label="Stop audio file">■</button><span id="file-name"></span><input type="range" id="file-position" min="0" max="1000" value="0" aria-label="Audio playback position"><output id="file-time">0:00 / 0:00</output><button id="file-mute" aria-label="Mute playback" aria-pressed="false"><svg class="ui-icon icon-blue" aria-hidden="true"><use href="icons/fontawesome.svg#volume-high"></use></svg></button><button id="close-file" aria-label="Close audio file">×</button></div><div class="secondary-text" id="secondary-text" hidden></div></div></div>
  </section>
  <div class="macrobar" aria-label="Macros"><button disabled class="macro teal">CQ ▸|</button><button disabled class="macro teal">ANS ▸|</button><button disabled class="macro teal">QSO ▸▸</button><button disabled class="macro teal">KN Ⅱ</button><button disabled class="macro red">SK Ⅱ</button><button disabled class="macro red">Me/Qth</button><button disabled class="macro red">Brag</button><button disabled class="macro red"></button><button disabled class="macro blue">T/R</button><button disabled class="macro blue">Tx ▸▸</button><button id="rx-button" class="macro blue" title="Start or stop live audio capture (F3)">Rx Ⅱ</button><button disabled class="macro blue">TX ▸|</button><button disabled class="macro-page">1</button></div>
  <section class="waterfall-panel" aria-label="Waterfall and signal scope"><div class="waterfall-wrap"><canvas id="waterfall" aria-label="Audio waterfall; hover to preview, click to tune"></canvas><canvas id="frequency-scale" aria-hidden="true"></canvas><svg id="tuning-cursor" class="tuning-cursor" aria-hidden="true" focusable="false" preserveAspectRatio="none"></svg></div><canvas id="scope" role="button" tabindex="0" aria-label="Signal scope"></canvas><div id="signal-meter" class="signal-meter" role="meter" aria-label="Detected signal level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" title="Detected signal level"><div id="signal-meter-fill"></div></div><input id="squelch-slider" class="squelch-slider" type="range" min="0" max="100" step="1" value="3" aria-label="Signal bar squelch threshold" aria-orientation="vertical" title="Squelch level"></section>
  <div class="waterfall-controls"><button id="display-mode" title="Waterfall / spectrum">WF</button><button data-adjust="reference:-1">◀</button><input id="reference" type="number" value="-20" aria-label="Waterfall reference level"><button data-adjust="reference:1">▶</button><button data-adjust="span:-1">◀</button><input id="span" type="number" value="70" aria-label="Waterfall amplitude span"><button data-adjust="span:1">▶</button><button id="magnification">x1</button><button id="waterfall-pause" aria-label="Pause waterfall">Ⅱ</button><button id="waterfall-speed">NORM</button><button data-tune="-100" aria-label="Tune down 100 Hz" title="Tune down 100 Hz">◀◀</button><button data-tune="-10" aria-label="Tune down 10 Hz" title="Tune down 10 Hz">◀</button><input id="frequency" type="number" value="1500" min="0" max="4000" aria-label="Receive audio frequency"><button data-tune="10" aria-label="Tune up 10 Hz" title="Tune up 10 Hz">▶</button><button data-tune="100" aria-label="Tune up 100 Hz" title="Tune up 100 Hz">▶▶</button><button disabled>QSY</button><button id="store-frequency" disabled title="Receive frequency is saved automatically when tuned">Store</button><button id="frequency-lock" disabled aria-pressed="false" title="Transmit frequency lock is disabled in this receive-only version">⌜Lk</button><button id="reverse" aria-pressed="false">⌜Rv</button><button disabled>⌜T/R</button></div>
  <footer class="statusbar"><button id="current-mode" title="Select operating mode">BPSK31</button><span id="status1">S/N ---</span><span id="status2">IMD ---</span><span id="status-message" role="status" aria-live="polite">Loading fldigi modems…</span><button id="source-indicator" title="Audio source">RX</button><button data-adjust="squelch:-1">◀</button><input id="squelch" type="number" value="3" min="0" max="100" aria-label="Squelch threshold"><button data-adjust="squelch:1">▶</button><span class="diamond">◆</span><button id="afc" class="indicator" aria-pressed="true"><i class="green"></i>AFC</button><button id="sql" class="indicator" aria-pressed="false"><i class="yellow"></i>SQL</button><button disabled class="indicator">⌜KPSQL</button></footer>
</main>
<dialog id="configuration" class="classic-dialog"><div class="dialog-title"><span>Fldigi configuration</span><button data-close-dialog="configuration" aria-label="Close configuration">×</button></div><div class="configuration-body"><nav class="config-tree" id="config-tree" aria-label="Configuration categories"></nav><div class="config-content"><div id="config-caption"></div><div id="config-fields"></div></div></div><div class="dialog-footer"><button id="collapse-tree">Collapse Tree</button><button id="restore-defaults">Restore defaults</button><span></span><button id="save-config">Save</button><button data-close-dialog="configuration">Close ↵</button></div></dialog>
<dialog id="message-dialog" class="classic-dialog message-dialog"><div class="dialog-title"><span id="message-title"></span><button data-close-dialog="message-dialog" aria-label="Close">×</button></div><div id="message-content"></div><div class="dialog-footer"><button id="message-download" hidden>Save…</button><span></span><button data-close-dialog="message-dialog">Close ↵</button></div></dialog>
<dialog id="picture-dialog" class="classic-dialog picture-dialog"><div class="dialog-title"><span>Received image</span><button data-close-dialog="picture-dialog" aria-label="Close received image">×</button></div><div class="picture-scroll"><canvas id="received-picture" aria-label="Decoded radio image"></canvas></div><div id="fax-controls" class="fax-controls" hidden><button data-fax-action="40">Skip APT</button><button data-fax-action="41">Skip phasing</button><button data-fax-action="42">End reception</button></div><div class="dialog-footer"><button id="save-picture">Save…</button><span id="picture-size"></span><button data-close-dialog="picture-dialog">Close ↵</button></div></dialog>
<input id="audio-upload" type="file" accept="audio/*,.wav,.wave,.flac,.mp3,.ogg,.m4a" hidden><input id="config-upload" type="file" accept="application/json,.json" hidden><audio id="audio-file" preload="metadata"></audio>
<script type="module" src="app.js"></script>
</body></html>
